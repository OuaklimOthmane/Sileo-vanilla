<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Playground · sileo-vanilla</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/site.css">
</head>
<body>
	<header class="top">
		<a class="brand" href="./"><span class="mark"></span>sileo-vanilla</a>
		<nav class="nav">
			<a class="hide-sm" href="https://github.com/OuaklimOthmane/Sileo-vanilla">GitHub</a>
			<a href="docs.html">Docs</a>
			<a class="on" href="play.html">Playground</a>
			<button class="icon-btn" data-theme-toggle aria-label="Switch light or dark">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
			</button>
		</nav>
	</header>

	<main class="play">
		<h1>Playground<span class="dot">.</span></h1>
		<p>Pick a position, set the look, then fire any type.</p>

		<div class="group">
			<div class="label">Position</div>
			<div class="chips" id="positions"></div>
		</div>
		<div class="group">
			<div class="label">Type</div>
			<div class="chips">
				<button class="chip" data-demo="success">Success</button>
				<button class="chip" data-demo="error">Error</button>
				<button class="chip" data-demo="warning">Warning</button>
				<button class="chip" data-demo="info">Info</button>
				<button class="chip" data-demo="action">Action</button>
				<button class="chip" data-demo="promise">Promise</button>
				<button class="chip" data-demo="short">Title only</button>
				<button class="chip" data-demo="rich">Rich content</button>
			</div>
		</div>
		<div class="group">
			<div class="label">Roundness: <span id="rv">16</span></div>
			<input type="range" id="round" min="4" max="24" step="1" value="16" aria-label="Roundness">
		</div>
		<div class="group">
			<div class="label">Title case</div>
			<div class="chips" id="case">
				<button class="chip on" data-case="caps">Sileo ("Changes Saved")</button>
				<button class="chip" data-case="plain">Normal ("Changes saved")</button>
			</div>
		</div>
	</main>

	<footer><span>sileo-vanilla · MIT · by Ouaklim Othmane · port of <a href="https://github.com/hiaaryan/sileo">Sileo</a> by Aaryan</span><a href="docs.html">Docs →</a></footer>

	<script src="lib/sileo-vanilla.umd.js"></script>
	<script>
		const { toast, configure } = SileoVanilla;
		const $pos = document.getElementById("positions");
		["top-left", "top-center", "top-right", "bottom-left", "bottom-center", "bottom-right"].forEach((p) => {
			const b = document.createElement("button");
			b.className = "chip" + (p === "top-right" ? " on" : "");
			b.textContent = p;
			b.onclick = () => {
				toast.clear();
				configure({ position: p });
				$pos.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
			};
			$pos.appendChild(b);
		});
		const $r = document.getElementById("round");
		$r.oninput = () => {
			document.getElementById("rv").textContent = $r.value;
			configure({ options: Object.assign({}, configure().options, { roundness: Number($r.value) }) });
		};
		const style = document.createElement("style");
		document.head.appendChild(style);
		document.querySelectorAll("[data-case]").forEach((b) =>
			b.addEventListener("click", () => {
				document.querySelectorAll("[data-case]").forEach((x) => x.classList.toggle("on", x === b));
				style.textContent = b.dataset.case === "plain" ? "[data-sileo-title]{text-transform:none}" : "";
			})
		);
		const faces = ["AL", "BO", "CH"].map((t, i) => `<i style="background:${["#d9f2e4", "#e8e8e8", "#dcd8f6"][i]}">${t}</i>`).join("");
		window.demos = {
			success: () => toast.success({ title: "Changes saved", description: "Changes saved successfully to the database. Refresh the page to see them." }),
			error: () => toast.error({ title: "Something went wrong", description: "We're having trouble saving your changes to the server. Try again in a few minutes." }),
			warning: () => toast.warning({ title: "Storage almost full", description: "You've used 95% of your available storage. Upgrade your plan to continue." }),
			info: () => toast.info({ title: "Heads up", description: "A new version is ready. It will load the next time you open the app." }),
			action: () => toast.action({ title: "File uploaded", description: "Your file has been uploaded. Share it with your team?", button: { title: "Share now", onClick: () => toast.success({ title: "Link copied" }) } }),
			promise: () => toast.promise(new Promise((ok) => setTimeout(ok, 2000)), { loading: { title: "Booking your flight" }, success: { title: "Booking confirmed", description: "DEL → SFO, on time. Your ticket is in your inbox." } }),
			short: () => toast.success({ title: "Saved" }),
			rich: () => toast.info({ title: "Team update", description: { html: `<div class="who"><span class="faces">${faces}</span><span>Alice, Bob and Charlie joined the design team.</span></div>` } }),
		};
	</script>
	<script src="assets/site.js"></script>
</body>
</html>
